name: Test and deploy Word Forge

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: word-forge-production
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out protected master SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run zero-dependency checks
        run: npm test

      - name: Verify tested SHA is still master head
        shell: bash
        run: |
          head_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ "$GITHUB_SHA" != "$head_sha" ]; then
            echo "Refusing stale deploy: tested $GITHUB_SHA, current master is $head_sha"
            exit 1
          fi

      - name: Deploy tested source to Vercel production
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
