<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Forge — Latin Roots</title>

<style>
:root{
  --sky:#171310;
  --sky-deep:#09090A;
  --card:#241D18;
  --ink:#2B1608;
  --white:#FFF8E8;
  --cloud:#D8C9B8;
  --sun:#FFC04D;
  --sun-hot:#D95D16;
  --mint:#75E2A2;
  --coral:#FF806E;
  --grape:#F5A623;
  --brass-soft:#FFD878;
  --shadow:0 5px 0 rgba(0,0,0,.7);
  --pop:0 5px 0 rgba(0,0,0,.72),0 12px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(circle at 50% -10%,#4B2411 0%,var(--sky) 32%,var(--sky-deep) 82%);
  background-attachment:fixed;
  color:var(--white);
  font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;font-weight:700;
  min-height:100vh;
  overflow-x:hidden;
}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;font-weight:800;font-size:clamp(32px,6vw,48px);letter-spacing:.5px;
   text-shadow:0 4px 0 #000,0 0 24px rgba(255,111,23,.3)}
h1 .dot{color:var(--sun)}
.tagline{color:var(--cloud);font-size:14px;font-weight:800;background:rgba(255,255,255,.1);padding:8px 16px;border-radius:999px}
nav{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
nav button{
  font-family:inherit;font-weight:800;font-size:15px;
  background:rgba(255,255,255,.12);color:var(--white);border:none;
  border-radius:16px;padding:10px 20px;cursor:pointer;transition:transform .12s,background .12s;
  box-shadow:0 4px 0 rgba(0,0,0,.4);
}
nav button:hover{transform:translateY(-2px);background:rgba(255,255,255,.22)}
nav button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
nav button.active{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--sun-hot),0 8px 18px rgba(255,201,60,.35)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.scorebar{display:flex;gap:12px;align-items:center;margin-bottom:18px;font-size:14px;color:var(--cloud);flex-wrap:wrap}
.scorebar>span{background:rgba(255,255,255,.12);border-radius:999px;padding:7px 16px;font-weight:800;display:flex;align-items:center;gap:6px}
.scorebar b{color:var(--sun);font-size:19px;font-family:inherit}
.progress{flex:1;min-width:120px;height:14px;background:rgba(0,0,0,.4);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.progress i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--sun),var(--sun-hot));
  box-shadow:0 0 12px rgba(255,201,60,.7);width:0%;transition:width .35s cubic-bezier(.5,1.6,.4,1)}
.card{background:linear-gradient(145deg,#2B211A,var(--card));border-radius:26px;padding:28px 22px;margin-bottom:18px;
  box-shadow:0 8px 0 #080706,0 18px 40px rgba(0,0,0,.5);
  border:3px solid rgba(255,192,77,.14)}
.prompt-label{font-family:inherit;font-size:15px;letter-spacing:.5px;color:var(--sun);margin-bottom:10px}
.bigword{font-family:inherit;font-weight:800;font-size:clamp(34px,7vw,56px);text-align:center;margin:10px 0 6px;letter-spacing:1px}
.bigword .hl{color:var(--sun);border-bottom:5px solid var(--sun);border-radius:2px;padding-bottom:2px}
.subtext{text-align:center;color:var(--cloud);font-size:16px;margin-bottom:6px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
.choice{
  background:var(--white);color:var(--ink);border:none;
  border-radius:16px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;text-align:left;
  font-family:inherit;box-shadow:var(--shadow);transition:transform .12s;
}
.choice:hover{transform:translateY(-3px) rotate(-.5deg)}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.55)}
.choice.correct{background:var(--mint);color:#0B3D22;animation:snapin .4s cubic-bezier(.5,1.8,.4,1)}
.choice.incorrect{background:var(--coral);color:#4A0F0F;animation:wobble .5s}
.choice:disabled{cursor:default}
@keyframes snapin{0%{transform:scale(.85)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* ---------- snap-block building tray (signature) ---------- */
.stick{
  display:flex;gap:6px;justify-content:center;align-items:stretch;margin:22px 0 8px;flex-wrap:wrap;
  padding:20px 16px;border-radius:20px;background:rgba(0,0,0,.35);
  box-shadow:inset 0 4px 10px rgba(0,0,0,.35);
}
.slot{
  min-width:118px;min-height:74px;border:3px dashed rgba(255,255,255,.4);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 12px;
  transition:transform .15s;
}
.slot .slabel{font-family:inherit;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cloud)}
.slot.filled{border-style:solid;border-color:transparent;animation:snapin .35s cubic-bezier(.5,1.8,.4,1)}
.slot.filled .sval{cursor:pointer}
#slot-prefix.filled{background:var(--sun);color:var(--ink)}
#slot-stem.filled{background:var(--white);color:var(--ink)}
#slot-suffix.filled{background:var(--grape);color:var(--ink)}
.slot.filled .slabel{color:rgba(43,22,8,.6)}
.slot .sval{font-family:inherit;font-weight:800;font-size:26px}
/* tiles: chunky snap-blocks, color-coded by part */
.bank{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px}
.tile{
  border:none;border-radius:14px;
  font-family:inherit;font-weight:800;font-size:22px;padding:12px 18px 10px;cursor:pointer;
  box-shadow:var(--pop);transition:transform .12s;position:relative;color:var(--ink);
}
.tile::after{ /* snap-stud on top, like a building block */
  content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:26px;height:10px;border-radius:6px 6px 0 0;background:inherit;filter:brightness(.92);
}
.tile-prefix{background:var(--sun)}
.tile-stem{background:var(--white)}
.tile-suffix{background:var(--grape)}
.tile small{display:block;font-family:inherit;font-weight:800;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:rgba(43,22,8,.65);margin-top:2px}
.tile:hover{transform:translateY(-4px) rotate(-1deg) scale(1.04)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.55)}
.tile.used{opacity:.25;pointer-events:none}
.actions{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{font-family:inherit;font-weight:700;font-size:17px;border-radius:16px;padding:12px 28px;cursor:pointer;border:none;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-hot)}
.btn-primary:active{box-shadow:0 1px 0 var(--sun-hot)}
.btn-ghost{background:rgba(255,255,255,.12);color:var(--white);box-shadow:0 4px 0 rgba(0,0,0,.4)}
.btn-ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.4)}
.feedback{text-align:center;margin-top:16px;font-size:17px;min-height:56px;font-weight:800}
.feedback .lit{color:var(--sun);font-family:inherit;font-size:20px}
.feedback.good{color:var(--mint)} .feedback.bad{color:#FFB3B3}
.feedback .expl{color:var(--cloud);font-size:14.5px;margin-top:4px;display:block;font-weight:700}
.header-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sound-toggle{border:2px solid rgba(255,192,77,.45);background:#211912;color:var(--white);border-radius:999px;padding:8px 12px;font:inherit;cursor:pointer}
.levelbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;color:var(--cloud);font-size:14px}
.levelbar>span{background:rgba(255,255,255,.08);border:1px solid rgba(255,192,77,.2);border-radius:999px;padding:7px 12px}
.levelbar strong{color:var(--sun)}
.save-banner{display:none;background:#5A2415;color:#FFF8E8;border:2px solid #FF9B61;border-radius:14px;padding:10px 14px;margin-bottom:14px}
.save-banner.show{display:block}
.combo-pill{color:var(--brass-soft)}
.forged-ignite{animation:ignite .75s ease-out}
.anvil-impact{animation:impact .34s ease-out}
@keyframes ignite{0%{text-shadow:none;filter:brightness(1)}45%{text-shadow:0 0 8px #fff,0 0 24px #ffb13b,0 0 46px #e34e0c;filter:brightness(1.5)}100%{text-shadow:0 0 12px rgba(255,177,59,.6);filter:brightness(1)}}
@keyframes impact{0%{transform:translateY(-5px)}45%{transform:translateY(4px) scale(.985)}70%{transform:translateY(-2px)}100%{transform:none}}
.vault-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.vault-empty{text-align:center;color:var(--cloud);padding:40px 10px}
/* lexicon */
.lex-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.lex-tabs button{background:rgba(255,255,255,.12);border:none;color:var(--white);border-radius:12px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.4);transition:transform .12s}
.lex-tabs button:hover{transform:translateY(-2px)}
.lex-tabs button.active{background:var(--white);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.55)}
.lex-search{width:100%;padding:13px 18px;border-radius:14px;border:none;background:rgba(0,0,0,.35);color:var(--white);font-size:16px;margin-bottom:14px;font-family:inherit;font-weight:700;box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}
.lex-search::placeholder{color:var(--cloud)}
.lex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.lex-item{background:rgba(255,255,255,.1);border-radius:16px;padding:15px;border:2px solid rgba(255,255,255,.08)}
.lex-item .part{font-family:inherit;font-weight:800;font-size:24px;color:var(--sun)}
.lex-item .mean{font-size:14.5px;margin:3px 0}
.lex-item .ex{font-size:12.5px;color:var(--cloud)}
.done-card{text-align:center;padding:44px 20px}
.done-card .score-big{font-family:inherit;font-weight:800;font-size:76px;color:var(--sun);text-shadow:0 5px 0 rgba(0,0,0,.5);animation:snapin .5s cubic-bezier(.5,1.8,.4,1)}
/* sparkles */
#sparkle-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.spark{position:absolute;font-size:20px;animation:sparkfly .9s ease-out forwards}
@keyframes sparkfly{
  0%{transform:translate(0,0) scale(.6) rotate(0deg);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(1.5) rotate(var(--rot));opacity:0}
}
/* flashcards */
.fc-stage{display:flex;flex-direction:column;align-items:center;gap:18px}
.fc-count{color:var(--cloud);font-size:14px;font-weight:800}
.flashcard{width:min(430px,90vw);height:270px;perspective:1200px;cursor:pointer;background:none;border:none;padding:0}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,1.4,.5,1);transform-style:preserve-3d}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;box-shadow:var(--pop)}
.fc-front{background:var(--white);color:var(--ink)}
.fc-front .fc-part{font-family:inherit;font-weight:800;font-size:54px}
.fc-front .fc-type{font-family:inherit;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#6B5310;background:var(--sun);padding:4px 14px;border-radius:999px}
.fc-hint{font-size:13px;color:#806F5D;position:absolute;bottom:16px;font-weight:800}
.fc-back{background:var(--sky-deep);border:4px solid var(--sun);color:var(--white);transform:rotateY(180deg)}
.fc-back .fc-part{font-family:inherit;font-weight:800;font-size:28px;color:var(--sun)}
.fc-back .fc-mean{font-size:20px;text-align:center;font-weight:800}
.fc-back .fc-ex{font-size:14.5px;color:var(--cloud)}
.fc-back .fc-def{font-size:14.5px;color:var(--white);text-align:center;max-width:350px}
.fc-back .fc-lit{font-size:13.5px;color:var(--cloud);font-style:italic}
.fc-nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* story modal */
.story-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.story-card{background:var(--white);color:var(--ink);border-radius:26px;max-width:480px;width:100%;padding:30px 26px;box-shadow:0 10px 0 rgba(0,0,0,.5),0 30px 60px rgba(0,0,0,.5);animation:snapin .45s cubic-bezier(.5,1.8,.4,1);text-align:center}
.story-card .story-badge{font-family:inherit;font-size:13px;letter-spacing:2px;text-transform:uppercase;background:var(--sun);color:#6B5310;display:inline-block;padding:5px 16px;border-radius:999px;margin-bottom:10px}
.story-card .story-emoji{font-size:44px;margin:4px 0}
.story-card h3{font-family:inherit;font-weight:800;font-size:24px;margin-bottom:10px}
.story-card p{font-size:15.5px;font-weight:700;line-height:1.55;color:#342516;text-align:left}
.story-card .btn{margin-top:18px}
/* stories collection */
.story-item{background:rgba(255,255,255,.1);color:var(--white);border-radius:16px;padding:16px;border:2px solid rgba(255,255,255,.08);cursor:pointer;transition:transform .12s;text-align:left;width:100%;font:inherit}
.story-item:hover{transform:translateY(-2px)}
.story-item.locked{opacity:.45;cursor:default}
.story-item .st-title{font-family:inherit;font-weight:800;font-size:17px;color:var(--sun)}
.story-item .st-tease{font-size:13px;color:var(--cloud);margin-top:3px}
/* prefix family expander in lexicon */
.lex-item.expandable{cursor:pointer;transition:transform .12s}
.lex-item.expandable:hover{transform:translateY(-2px);border-color:var(--sun)}
.family-panel{grid-column:1/-1;background:rgba(0,0,0,.35);border-radius:18px;padding:20px;border:2px solid var(--sun)}
.family-panel h3{font-family:inherit;font-size:22px;color:var(--sun);margin-bottom:6px}
.family-panel .fam-story{font-size:14.5px;line-height:1.55;color:var(--white);margin-bottom:12px}
.family-chips{display:flex;flex-wrap:wrap;gap:8px}
.family-chips span{background:var(--white);color:var(--ink);border-radius:999px;padding:6px 14px;font-family:inherit;font-weight:700;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.5)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.spark{display:none!important}}
@media (max-width:520px){
  .wrap{padding:20px 12px 70px}
  header{align-items:stretch}
  .header-tools{width:100%}
  .tagline{flex:1 1 190px;text-align:center;padding:8px 10px}
  .sound-toggle{flex:1 1 120px}
  nav{gap:8px}
  nav button{flex:1 1 105px;padding:10px 8px;font-size:14px}
  .levelbar,.scorebar{gap:8px}
  .levelbar>span,.scorebar>span{padding:7px 10px}
  .card{padding:24px 13px}
  .bigword{overflow-wrap:anywhere;word-break:normal}
  .stick{padding:18px 6px;overflow:hidden}
  .slot{min-width:0;flex:1 1 82px;padding:8px 4px}
  .slot .sval{font-size:21px}
  .tile{padding:11px 14px 9px;font-size:20px;max-width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Word Forge<span class="dot">.</span></h1>
    <div class="header-tools"><div class="tagline">⚒️ Strike roots. Forge meaning.</div><button id="sound-toggle" class="sound-toggle" type="button" onclick="toggleSound()" aria-pressed="false">🔊 Sound on</button></div>
  </header>

  <nav>
    <button id="tab-forge" class="active" onclick="setMode('forge')">🔨 Forge</button>
    <button id="tab-decode" onclick="setMode('decode')">🔍 Decode</button>
    <button id="tab-lexicon" onclick="setMode('lexicon')">📚 Lexicon</button>
    <button id="tab-cards" onclick="setMode('cards')">⚡ Flashcards</button>
    <button id="tab-stories" onclick="setMode('stories')">📖 Stories <span id="story-count"></span></button>
    <button id="tab-vault" onclick="setMode('vault')">🗝️ Fact Vault</button>
  </nav>

  <div class="save-banner" id="save-banner" role="status">Progress won't be saved on this device. You can keep forging.</div>
  <div class="levelbar" aria-label="Forge progress">
    <span>🔥 Daily streak <strong id="daily-streak">0</strong></span>
    <span>⚒️ <strong id="rank">Apprentice</strong> · Level <strong id="level">1</strong></span>
    <span>✨ <strong id="xp">0</strong> XP</span>
    <div class="progress" aria-label="Progress to next level"><i id="level-prog"></i></div>
  </div>

  <div class="scorebar" id="scorebar">
    <span>Round XP <b id="score">0</b></span>
    <span class="combo-pill">🔥 Combo <b id="streak">0</b></span>
    <div class="progress"><i id="prog"></i></div>
    <span id="roundlabel">1 / 10</span>
  </div>

  <div id="stage"></div>
<div id="sparkle-layer"></div>
</div>

<script src="data/words.js"></script>
<script src="data/facts.js"></script>
<script src="data/stories.js"></script>
<script src="core.js"></script>
<script>
/* ============ DATA ALIASES ============ */
const { PREFIXES, STEMS, SUFFIXES, FAMILY_NOTES, WORDS, FACTS, STORIES } = window.WF;
const REVIEWED_WORDS = WF.WORDS.filter(word => word[6] === true);
const core = WF.core;

/* ============ SOUND & SPARKLES ============ */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(freq,start,dur,type="sine",vol=0.18){
  if(!progress.soundOn)return;
  const c=ac(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+start);
  g.gain.setValueAtTime(0,c.currentTime+start);
  g.gain.linearRampToValueAtTime(vol,c.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+start+dur);
  o.connect(g);g.connect(c.destination);
  o.start(c.currentTime+start);o.stop(c.currentTime+start+dur+0.05);
}
function sndFlip(){ // quick whoosh: pitch sweep
  if(!progress.soundOn)return;
  const c=ac(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type="triangle";
  o.frequency.setValueAtTime(280,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(720,c.currentTime+0.16);
  g.gain.setValueAtTime(0.12,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.2);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.25);
}
function sndCorrect(){ // bright major arpeggio
  tone(523.25,0,   .25,"sine",.16);
  tone(659.25,.09, .25,"sine",.16);
  tone(783.99,.18, .3, "sine",.16);
  tone(1046.5,.27, .4, "sine",.14);
}
function sndWrong(){ // warm, gentle "try again" — soft rising two-note nudge
  tone(392,0,  .28,"sine",.12);
  tone(440,.2, .34,"sine",.12);
}
function sparkleBurst(x,y,n=26){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const layer=$("sparkle-layer");
  const glyphs=["✦","✧","✨","★","·"];
  for(let i=0;i<n;i++){
    const sp=document.createElement("span");
    sp.className="spark";
    sp.textContent=glyphs[Math.floor(Math.random()*glyphs.length)];
    const ang=Math.random()*Math.PI*2, dist=60+Math.random()*140;
    sp.style.left=x+"px"; sp.style.top=y+"px";
    sp.style.color=Math.random()<.6?"var(--brass-soft)":"#FFFFFF";
    sp.style.setProperty("--dx",Math.cos(ang)*dist+"px");
    sp.style.setProperty("--dy",(Math.sin(ang)*dist-40)+"px");
    sp.style.setProperty("--rot",(Math.random()*360-180)+"deg");
    layer.appendChild(sp);
    setTimeout(()=>sp.remove(),950);
  }
}
function celebrateAt(el){
  const r=el.getBoundingClientRect();
  sparkleBurst(r.left+r.width/2, r.top+r.height/2);
}

/* ============ STORY TIME ============ */
let storiesUnlocked=0;
function updateStoryCount(){ $("story-count").textContent = storiesUnlocked?("("+storiesUnlocked+")"):""; }
function showStoryModal(i,isNew){
  enqueueRewards([{type:"story",index:i,isNew:Boolean(isNew)}]);
}
function renderStories(){
  storiesUnlocked=core.storyUnlockCount(progress.correctTotal,STORIES.length);
  $("stage").innerHTML=`
    <div class="card">
      <div class="prompt-label">\u{1F4D6} Story Time \u00b7 Unlock a new word-history story every 3 correct answers!</div>
      <div class="lex-grid">${STORIES.map((st,i)=> i<storiesUnlocked
        ? `<button type="button" class="story-item" onclick="showStoryModal(${i},false)"><div class="st-title">${st[0]} ${st[1]}</div><div class="st-tease">Tap to read again</div></button>`
        : `<div class="story-item locked"><div class="st-title">\u{1F512} Story #${i+1}</div><div class="st-tease">Get ${Math.max(1,(i+1)*3-progress.correctTotal)} more correct answers to unlock</div></div>`
      ).join("")}</div>
    </div>`;
}

/* ============ AHA! FACTS (shown right after answering these words) ============ */
function ahaLine(word){
  const f=FACTS[word];
  return f?`<span class="expl" style="color:var(--sun);font-weight:800">\u{1F4A1} Aha! ${f}</span>`:"";
}

/* ============ STATE & PERSISTENCE ============ */
const STORAGE_KEY="wordforge.v1";
const FACT_KEYS=Object.keys(FACTS);
const COLLECTIBLE_FACT_KEYS=FACT_KEYS.filter(key=>REVIEWED_WORDS.some(word=>word[0]===key));
let progress=core.defaultState(), storageReadOnly=false, storageFailed=false;
let mode="forge", score=0, combo=0, round=0, ROUNDS=10;
let current=null, answered=false, forgePicks={};

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const meaningOf=(list,key)=>{const f=list.find(x=>x[0]===key);return f?f[1]:"";};

function showSaveBanner(message){
  const banner=$("save-banner");
  if(message)banner.textContent=message;
  banner.classList.add("show");
}
function todayKey(){return core.localDateKey(new Date());}
function readProgress(){
  try{
    const result=core.processStoredValue(localStorage.getItem(STORAGE_KEY),FACT_KEYS,todayKey());
    progress=result.state; storageReadOnly=result.readOnly;
    if(result.readOnly)showSaveBanner("Newer progress data was found. This tab is using a read-only session so it won't overwrite it.");
    if(result.shouldPersist)localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));
  }catch(error){storageFailed=true;progress=core.defaultState();showSaveBanner();}
  updateHeader();
}
function mutateProgress(action){
  if(storageReadOnly||storageFailed){progress=core.mergeAction(progress,action,FACT_KEYS,todayKey());updateHeader();return;}
  try{
    const latest=core.processStoredValue(localStorage.getItem(STORAGE_KEY),FACT_KEYS,todayKey());
    if(latest.readOnly){storageReadOnly=true;progress=core.mergeAction(progress,action,FACT_KEYS,todayKey());showSaveBanner("Newer progress data was found. This tab is using a read-only session so it won't overwrite it.");updateHeader();return;}
    progress=core.mergeAction(latest.state,action,FACT_KEYS,todayKey());
    localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));
  }catch(error){storageFailed=true;progress=core.mergeAction(progress,action,FACT_KEYS,todayKey());showSaveBanner();}
  updateHeader();
}
function updateHeader(){
  if(!$("xp"))return;
  const rank=core.deriveLevel(progress.xp);
  $("xp").textContent=progress.xp;
  $("level").textContent=rank.level;
  $("rank").textContent=rank.rank;
  $("daily-streak").textContent=core.normalizeDisplayedStreak(progress,todayKey());
  $("level-prog").style.width=(rank.progress*100)+"%";
  storiesUnlocked=core.storyUnlockCount(progress.correctTotal,STORIES.length);
  updateStoryCount();
  $("sound-toggle").textContent=progress.soundOn?"🔊 Sound on":"🔇 Sound off";
  $("sound-toggle").setAttribute("aria-pressed",String(progress.soundOn));
}
function toggleSound(){mutateProgress({soundOn:!progress.soundOn});if(progress.soundOn)sndFlip();}

/* ============ SERIALIZED ACCESSIBLE REWARDS ============ */
let rewardQueue=[],rewardOpen=false,pendingMode=null,modalRestore=null;
function enqueueRewards(items){
  const priority={level:0,story:1,fact:2};
  rewardQueue.push(...items);
  rewardQueue.sort((a,b)=>priority[a.type]-priority[b.type]);
  pumpRewards();
}
function pumpRewards(){
  if(rewardOpen)return;
  const reward=rewardQueue.shift();
  if(!reward){if(pendingMode){const next=pendingMode;pendingMode=null;applyMode(next);}return;}
  if(reward.type==="fact"&&!progress.seenFacts.includes(reward.word))mutateProgress({seenFacts:[reward.word]});
  showRewardDialog(reward);
}
function rewardContent(reward){
  if(reward.type==="level")return {badge:"⚒️ Level up!",emoji:"🔥",title:reward.rank,body:`You reached level ${reward.level}. Keep the forge glowing!`,button:"Keep forging"};
  if(reward.type==="story"){
    const st=STORIES[reward.index];
    return {badge:reward.isNew?"🔓 New story unlocked!":"📖 Story time",emoji:st[0],title:st[1],body:st[2],button:"Close story"};
  }
  return {badge:"💡 Secret discovered",emoji:"🗝️",title:reward.word,body:FACTS[reward.word],button:"Add to Fact Vault"};
}
function showRewardDialog(reward){
  rewardOpen=true;modalRestore=document.activeElement;
  const content=rewardContent(reward),ov=document.createElement("div"),titleId=`reward-${Date.now()}`;
  ov.className="story-overlay";
  ov.innerHTML=`<div class="story-card" role="dialog" aria-modal="true" aria-labelledby="${titleId}"><div class="story-badge"></div><div class="story-emoji"></div><h3 id="${titleId}"></h3><p></p><button class="btn btn-primary" type="button"></button></div>`;
  ov.querySelector(".story-badge").textContent=content.badge;
  ov.querySelector(".story-emoji").textContent=content.emoji;
  ov.querySelector("h3").textContent=content.title;
  ov.querySelector("p").textContent=content.body;
  const close=ov.querySelector("button");close.textContent=content.button;
  function dismiss(){
    ov.remove();document.removeEventListener("keydown",onKey);rewardOpen=false;
    if(modalRestore&&document.contains(modalRestore))modalRestore.focus();
    modalRestore=null;pumpRewards();
  }
  function onKey(event){
    if(event.key==="Escape"){event.preventDefault();dismiss();return;}
    if(event.key==="Tab"){
      const focusable=[...ov.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')];
      if(!focusable.length){event.preventDefault();return;}
      const first=focusable[0],last=focusable[focusable.length-1];
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
    }
  }
  close.addEventListener("click",dismiss);document.addEventListener("keydown",onKey);document.body.appendChild(ov);close.focus();
  if(reward.type!=="fact")sndCorrect();
  sparkleBurst(window.innerWidth/2,window.innerHeight/3,20);
}

function awardCorrect(word){
  const beforeXp=progress.xp;
  const beforeStories=core.storyUnlockCount(progress.correctTotal,STORIES.length);
  const gain=core.xpForCombo(combo);
  mutateProgress({xpDelta:gain,correctDelta:1,qualifyingPlay:true});
  const afterLevel=core.deriveLevel(progress.xp);
  const rewards=[];
  if(core.didLevelUp(beforeXp,progress.xp))rewards.push({type:"level",level:afterLevel.level,rank:afterLevel.rank});
  const afterStories=core.storyUnlockCount(progress.correctTotal,STORIES.length);
  if(afterStories>beforeStories)rewards.push({type:"story",index:afterStories-1,isNew:true});
  if(FACTS[word]&&!progress.seenFacts.includes(word))rewards.push({type:"fact",word});
  if(rewards.length)enqueueRewards(rewards);
  return gain;
}

function setMode(m){
  if(rewardOpen||rewardQueue.length){pendingMode=m;return;}
  applyMode(m);
}
function applyMode(m){
  mode=m; round=0; score=0; combo=0;
  ["forge","decode","lexicon","cards","stories","vault"].forEach(t=>$("tab-"+t).classList.toggle("active",t===m));
  $("scorebar").style.display = (["lexicon","cards","stories","vault"].includes(m)) ? "none":"flex";
  updateBar();
  if(m==="lexicon")renderLexicon();else if(m==="cards")renderCards();else if(m==="stories")renderStories();else if(m==="vault")renderFactVault();else nextRound();
}
function updateBar(){
  $("score").textContent=score; $("streak").textContent=combo;
  $("prog").style.width=(round/ROUNDS*100)+"%";
  $("roundlabel").textContent=Math.min(round+1,ROUNDS)+" / "+ROUNDS;
}
function nextRound(){
  if(round>=ROUNDS){renderDone();return;}
  answered=false;
  if(mode==="decode") renderDecode(); else renderForge();
  updateBar();
}
function markResult(ok,word){
  answered=true;
  if(ok){score+=awardCorrect(word);combo++;}else combo=0;
  round++;
}

/* ============ DECODE MODE ============ */
function renderDecode(){
  const w=pick(REVIEWED_WORDS);
  // choose which part to quiz: prefix, stem, or suffix (if present)
  const parts=[["prefix",w[1],PREFIXES],["stem",w[2],STEMS],["suffix",w[3],SUFFIXES]].filter(p=>p[1]);
  const [ptype,pkey,plist]=pick(parts);
  const correct=meaningOf(plist,pkey);
  const wrongs=shuffle(plist.filter(x=>x[0]!==pkey&&x[1]!==correct)).slice(0,3).map(x=>x[1]);
  const opts=shuffle([correct,...wrongs]);
  current={w,ptype,pkey,correct};

  // build highlighted word display
  const clean=s=>s?s.replace(/-/g,""):"";
  const pre=clean(w[1]), stem=w[2], suf=clean(w[3]);
  const word=w[0];
  // find spans: approximate by matching the quizzed part inside the word
  const target = ptype==="prefix"?pre : ptype==="suffix"?suf : stem;
  let html=word;
  const idx = ptype==="prefix" ? 0 : ptype==="suffix" ? word.length-suf.length : word.indexOf(stem);
  if(idx>=0 && target && word.slice(idx,idx+target.length)===target){
    html = word.slice(0,idx)+'<span class="hl">'+target+'</span>'+word.slice(idx+target.length);
  } else {
    html = word+' <span class="hl">('+pkey+')</span>';
  }

  $("stage").innerHTML=`
    <div class="card">
      <div class="prompt-label">🔍 Decode · What does the highlighted ${ptype} mean?</div>
      <div class="bigword">${html}</div>
      <div class="subtext">"${w[0]}" — ${w[5]}</div>
      <div class="choices">${opts.map(o=>`<button class="choice" onclick="answerDecode(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>
      <div class="actions"><button class="btn btn-ghost" id="nextbtn" style="display:none" onclick="nextRound()">Next word 👉</button></div>
    </div>`;
}
function answerDecode(btn,val){
  if(answered)return;
  const ok = val===current.correct;
  const w=current.w;
  markResult(ok,w[0]);
  document.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;
    if(b.textContent===current.correct)b.classList.add("correct");
  });
  if(!ok)btn.classList.add("incorrect");
  if(ok){sndCorrect();celebrateAt(btn);document.querySelector(".bigword").classList.add("forged-ignite");}else{sndWrong();}
  const lit=`<span class="lit">${w[0]}</span> = ${[w[1],w[2],w[3]].filter(Boolean).join(" + ")} — literally "${w[4]}"`;
  $("fb").className="feedback "+(ok?"good":"bad");
  $("fb").innerHTML=(ok?"🔥 Forged true! ":"💪 So close — check the answer! ")+`<span class="expl">${lit}</span>`;
  $("nextbtn").style.display="inline-block";
  updateBar();
}

/* ============ FORGE MODE ============ */
function renderForge(){
  const w=pick(REVIEWED_WORDS);
  current={w};
  forgePicks={prefix:null,stem:null,suffix:null};
  const needSuffix=!!w[3], needPrefix=!!w[1];

  const bankTiles=[];
  if(needPrefix){
    bankTiles.push({t:"prefix",v:w[1]});
    shuffle(PREFIXES.filter(p=>p[0]!==w[1])).slice(0,2).forEach(p=>bankTiles.push({t:"prefix",v:p[0]}));
  }
  bankTiles.push({t:"stem",v:w[2]});
  shuffle(STEMS.filter(s=>s[0]!==w[2])).slice(0,2).forEach(s=>bankTiles.push({t:"stem",v:s[0]}));
  if(needSuffix){
    bankTiles.push({t:"suffix",v:w[3]});
    shuffle(SUFFIXES.filter(s=>s[0]!==w[3])).slice(0,2).forEach(s=>bankTiles.push({t:"suffix",v:s[0]}));
  }
  current.bank=shuffle(bankTiles);
  current.needSuffix=needSuffix; current.needPrefix=needPrefix;

  $("stage").innerHTML=`
    <div class="card">
      <div class="prompt-label">🔨 Forge · Build the word that means…</div>
      <div class="bigword" style="font-size:clamp(22px,4vw,30px)">"${w[5]}"</div>
      <div class="subtext">Literal Latin sense: <em>${w[4]}</em></div>
      <div class="stick" id="stick">
        ${needPrefix?'<div class="slot" id="slot-prefix"><span class="slabel">prefix</span><span class="sval">&nbsp;</span></div>':""}
        <div class="slot" id="slot-stem"><span class="slabel">stem</span><span class="sval">&nbsp;</span></div>
        ${needSuffix?'<div class="slot" id="slot-suffix"><span class="slabel">suffix</span><span class="sval">&nbsp;</span></div>':""}
      </div>
      <div class="bank" id="bank"></div>
      <div class="actions">
        <button class="btn btn-primary" onclick="checkForge()">Snap it together!</button>
        <button class="btn btn-ghost" onclick="clearForge()">Clear</button>
      </div>
      <div class="feedback" id="fb"></div>
      <div class="actions"><button class="btn btn-ghost" id="nextbtn" style="display:none" onclick="nextRound()">Next word 👉</button></div>
    </div>`;
  renderBank();
}
function renderBank(){
  const lists={prefix:PREFIXES,stem:STEMS,suffix:SUFFIXES};
  $("bank").innerHTML=current.bank.map((tile,i)=>{
    const used=forgePicks[tile.t]===tile.v;
    return `<button class="tile tile-${tile.t} ${used?"used":""}" onclick="pickTile(${i})">${tile.v}<small>${meaningOf(lists[tile.t],tile.v)}</small></button>`;
  }).join("");
  ["prefix","stem","suffix"].forEach(t=>{
    const slot=$("slot-"+t); if(!slot)return;
    const v=forgePicks[t];
    slot.classList.toggle("filled",!!v);
    slot.querySelector(".sval").innerHTML=v||"&nbsp;";
    slot.onclick=v?()=>{if(!answered){forgePicks[t]=null;renderBank();}}:null;
  });
}
function pickTile(i){
  if(answered)return;
  const tile=current.bank[i];
  forgePicks[tile.t]=tile.v;
  renderBank();
  const slot=$("slot-"+tile.t);if(slot){celebrateAt(slot);tone(190,0,.12,"square",.07);}
}
function clearForge(){ if(answered)return; forgePicks={prefix:null,stem:null,suffix:null}; renderBank(); }
function checkForge(){
  if(answered)return;
  const w=current.w;
  if((current.needPrefix&&!forgePicks.prefix)||!forgePicks.stem||(current.needSuffix&&!forgePicks.suffix)){
    $("fb").className="feedback"; $("fb").textContent="Snap a block into every empty slot first!";
    return;
  }
  const ok = (!current.needPrefix||forgePicks.prefix===w[1])&&forgePicks.stem===w[2]&&(!current.needSuffix||forgePicks.suffix===w[3]);
  markResult(ok,w[0]);
  if(ok){sndCorrect();celebrateAt($("stick"));$("stick").classList.add("anvil-impact");}else{sndWrong();}
  $("fb").className="feedback "+(ok?"good":"bad");
  $("fb").innerHTML=(ok?"⚒️ CLANG! The word ignites! ":"💪 Good try! Peek at the answer — you\u2019ll crush it next time. ")+
    `<span class="expl"><span class="lit ${ok?"forged-ignite":""}">${w[0]}</span> = ${[w[1],w[2],w[3]].filter(Boolean).join(" + ")} — literally "${w[4]}"</span>`;
  $("nextbtn").style.display="inline-block";
  updateBar();
}

/* ============ LEXICON ============ */
let lexTab="prefix";
function renderLexicon(){
  $("stage").innerHTML=`
    <div class="card">
      <div class="prompt-label">📚 Lexicon · Every word part in the game</div>
      <div class="lex-tabs">
        <button id="lt-prefix" onclick="setLexTab('prefix')">Prefixes (${PREFIXES.length})</button>
        <button id="lt-stem" onclick="setLexTab('stem')">Stems (${STEMS.length})</button>
        <button id="lt-suffix" onclick="setLexTab('suffix')">Suffixes (${SUFFIXES.length})</button>
      </div>
      <input class="lex-search" id="lexsearch" placeholder="Search a part, meaning, or example…" oninput="renderLexGrid()">
      <div class="lex-grid" id="lexgrid"></div>

  setLexTab(lexTab);
}
function setLexTab(t){
  lexTab=t;
  ["prefix","stem","suffix"].forEach(x=>$("lt-"+x).classList.toggle("active",x===t));
  renderLexGrid();
}
function renderLexGrid(){
  const list={prefix:PREFIXES,stem:STEMS,suffix:SUFFIXES}[lexTab];
  const q=($("lexsearch").value||"").toLowerCase();
  let html=list
    .filter(x=>!q||x.join(" ").toLowerCase().includes(q))
    .map(x=>{
      const hasFam = lexTab==="prefix" && FAMILY_NOTES[x[0]];
      const open = hasFam && openFamily===x[0];
      let item=`<div class="lex-item ${hasFam?"expandable":""}" ${hasFam?`role="button" tabindex="0" onclick="toggleFamily('${x[0]}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleFamily('${x[0]}')}"`:""}>
        <div class="part">${x[0]} ${hasFam?(open?"\u25B4":"\u25BE"):""}</div>
        <div class="mean">${x[1]}</div><div class="ex">as in <em>${x[2]}</em>${hasFam?" \u00b7 <b>tap for the family story!</b>":""}</div></div>`;
      if(open){
        item+=`<div class="family-panel"><h3>The ${x[0]} family</h3>
          <div class="fam-story">${FAMILY_NOTES[x[0]]}</div>
          <div class="family-chips">${familyWords(x[0]).map(w=>"<span>"+w+"</span>").join("")}</div></div>`;
      }
      return item;
    })
    .join("")||'<div style="color:var(--cloud)">No parts match that search.</div>';
  $("lexgrid").innerHTML=html;
}

/* ============ FACT VAULT ============ */

/* ============ FLASHCARDS ============ */

function fcList(){

  return [...PREFIXES.map(x=>["prefix",...x]),...STEMS.map(x=>["stem",...x]),...SUFFIXES.map(x=>["suffix",...x]) ];

function setFcTab(t){
  fcTab=t;
  ["all","prefix","stem","suffix","words"].forEach(x=>$("fct-"+x).classList.toggle("active",x===t));

function showCard(){
  const c=fcDeck[fcIdx];
  $("fcard").classList.toggle("flipped",fcFlipped);
  if(c[0]==="word"){
    // c = ["word", word, prefix, stem, suffix, literal, definition]

}
function flipCard(){ fcFlipped=!fcFlipped; sndFlip(); $("fcard").classList.toggle("flipped",fcFlipped); }
function fcMove(d){
  fcFlipped=false;
  fcIdx=(fcIdx+d+fcDeck.length)%fcDeck.length;
  showCard();
}
function fcShuffle(){ fcDeck=shuffle(fcDeck); fcIdx=0; fcFlipped=false; showCard(); }

/* ============ PREFIX FAMILY JOURNEYS ============ */
let openFamily=null;
function toggleFamily(prefix){
  openFamily = openFamily===prefix ? null : prefix;
  renderLexGrid();
}
function familyWords(prefix){
  return WORDS.filter(w=>w[1]===prefix).map(w=>w[0]).slice(0,14);
}

/* ============ DONE ============ */
function renderDone(){
  const msg = score>=120?"🏆 WORD WIZARD! You\u2019re unstoppable!":score>=80?"🌟 Word Builder — awesome run!":"🚀 Great practice! Every round makes you stronger.";
  $("stage").innerHTML=`
    <div class="card done-card">
      <div class="prompt-label">You did it!</div>
      <div class="score-big">${score}</div>
      <div class="subtext">${msg}</div>
      <div class="actions">
        <button class="btn btn-primary" onclick="setMode('${mode}')">Play again</button>
        <button class="btn btn-ghost" onclick="setMode('${mode==="forge"?"decode":"forge"}')">Try ${mode==="forge"?"Decode":"Forge"}</button>
      </div>
    </div>`;
}

function checkDataIntegrity(){
  const sets={prefix:new Set(PREFIXES.map(x=>x[0])),stem:new Set(STEMS.map(x=>x[0])),suffix:new Set(SUFFIXES.map(x=>x[0]))};
  const wordKeys=new Set(WORDS.map(w=>w[0]));
  for(const key of FACT_KEYS)if(!wordKeys.has(key))console.warn("Word Forge orphan fact",key);
  for(const word of WORDS){
    if(word[1]&&!sets.prefix.has(word[1]))console.warn("Word Forge unknown prefix",word[0],word[1]);
    if(!sets.stem.has(word[2]))console.warn("Word Forge unknown stem",word[0],word[2]);
    if(word[3]&&!sets.suffix.has(word[3]))console.warn("Word Forge unknown suffix",word[0],word[3]);
  }
}
window.addEventListener("storage",event=>{
  if(event.key!==STORAGE_KEY)return;
  try{
    const latest=core.processStoredValue(event.newValue,FACT_KEYS,todayKey());
    if(latest.readOnly){
      storageReadOnly=true;
      showSaveBanner("Newer progress data was found. This tab is using a read-only session so it won't overwrite it.");
      return;
    }
    progress=latest.state;updateHeader();if(mode==="vault")renderFactVault();
  }catch(error){showSaveBanner();}
});
checkDataIntegrity();
readProgress();
setMode("forge");
</script>
